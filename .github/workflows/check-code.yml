# Checks code syntax, ruff linting, and tests
name: check-code

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Tests
        run: uv run pytest
